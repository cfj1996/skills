interface:
  display_name: "TAPD 工作流"
  short_description: "按 MCP、Superpowers、GitLab 和提测 Wiki 门禁处理 TAPD Bug/Story/Task"
  default_prompt: >-
    使用 $tapd-workflow 作为 TAPD Bug/Story/Task 的权威执行契约。显式出现 $tapd-workflow、/tapd-workflow、技能卡片或 TAPD 链接并要求处理时，本技能已触发；用户说直接修复/继续/不用日志不代表跳过门禁。进入完整采集前必须先做最小 TAPD 读取和项目路由，拿到 short-id 与目标项目仓库后执行 LocalGitResumeGate；未解析目标项目时必须 PENDING_PROJECT/BLOCKED，不得在当前 cwd 或猜测项目中搜分支。LocalGitResumeGate 优先用用户提供分支、TAPD/Wiki 分支线索、本地/远端 git ref、commit trailer 和 <ref>:docs/{short-id}/raw.md 恢复上下文；先查本地 refs，必要时才 fetch origin --prune 并记录；当前工作区 docs/{short-id} 只作最后加速路径，禁止仅因其不存在就判定首次开发。RESUME 时从旧 raw 恢复 PreviousContext，再叠加 LatestTapdRefresh 和 UserIncrement 确认本轮增量范围；用户提供分支但 raw 缺失或所有候选都缺 raw 时必须 NEED_CONFIRMATION。必须用 update_topic 维护阶段状态，不在正文打印冗长阶段台账。按链接类型采集 TAPD 上下文；开发前必须展示需求描述、Bug 描述、本轮处理、本轮不处理和历史内容处理策略，获得用户确认后才能进入开发阶段；进入开发阶段时先把 Bug 状态改为修复中，或把 Story/Task 状态改为进行中。测试代码只能放在 __test___/{short-id}/xxx.test.(js|ts)，plan、verification、评审、截图和 Superpowers 生成文档必须放在 docs/{short-id}/。必须记录 VerificationGate：expected_commands、actual_commands、退出码、关键输出和阻断原因。分支确认子流程通过前禁止修改代码；除阶段 1/2 维护 raw.md 外，任何编辑前必须有 PRE_EDIT_GATE: PASS；task/detail 不能按 bug 查询，MCP 返回 count: 0 时必须停在采集阶段重查。创建分支/worktree 前必须计算并展示 expected_branch_name 和 expected_worktree_path，用户确认必须针对具体值；创建后 actual 必须等于 expected 并写入 raw.md。复用已有分支默认不创建新 worktree，除非用户明确说明；复用分支记录 REUSE，不因历史命名不匹配当前模板而重建。合并前必须执行 MergeConfirmationGate，记录 expected/actual 分支、提交列表和用户确认文本。写 Wiki 必须执行 WikiWriteGate，写入后读回并确认包含预期补丁；代码分支名必须先记录 effective_wiki_branch_name，且只等于原开发源分支，冲突流程禁止把 merge/* 中间分支写入 Wiki。写 TAPD 评论必须执行 TAPD_COMMENT_GATE，actual_comment_body 必须完全等于 expected_comment_body。开发分支只能来自 origin/master 或用户指定功能分支，不能来自 origin/develop。阶段切换前运行 regression-checker；缺少证据时停止。最终必须输出本次流程明细。

policy:
  allow_implicit_invocation: true
