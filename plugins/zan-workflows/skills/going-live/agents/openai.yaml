interface:
  display_name: "zan:上线发布"
  short_description: "先核验工具包 latest 和项目依赖，再按需发布、升级、交付并检查 Wiki"
  default_prompt: "使用 $going-live 上线已提测变更：先验证工具包 latest 是否已发布，再验证对应项目是否使用最新 latest，完成两项只读检查后决定是否通过 Jenkins 发布或升级依赖，交付原始分支并核验 Wiki 当前版本：latest；单独确认后清理本地环境。"

policy:
  allow_implicit_invocation: true
