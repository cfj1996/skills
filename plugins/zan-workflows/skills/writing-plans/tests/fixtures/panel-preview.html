<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Delivery Review Panel Preview</title>
    <style>
      :root {
        color: rgba(0, 0, 0, .87);
        font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        background: #f5f7fa;
        margin: 0;
        min-height: 100vh;
      }

      [data-preview-prototype] {
        margin: 48px auto;
        max-width: 1120px;
        padding: 0 24px;
      }

      .preview-appbar {
        align-items: center;
        background: #fff;
        border-bottom: 1px solid rgba(0, 0, 0, .12);
        display: flex;
        height: 64px;
        justify-content: space-between;
        padding: 0 24px;
      }

      .preview-card {
        background: #fff;
        border: 1px solid rgba(0, 0, 0, .12);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        display: grid;
        gap: 20px;
        padding: 32px;
      }

      #login-form {
        display: grid;
        gap: 16px;
        max-width: 360px;
      }

      input {
        border: 1px solid rgba(0, 0, 0, .23);
        border-radius: 4px;
        min-height: 48px;
        padding: 0 12px;
      }

      button {
        background: #1976d2;
        border: 0;
        border-radius: 4px;
        color: #fff;
        min-height: 40px;
        padding: 8px 16px;
      }
    </style>
  </head>
  <body>
    <header class="preview-appbar">
      <strong>原型预览</strong>
      <span>评审面板开发测试页</span>
    </header>
    <main data-preview-prototype>
      <section class="preview-card">
        <div>
          <h1>登录</h1>
          <p>这是评审面板背后的模拟原型，仅用于开发预览。</p>
        </div>
        <form id="login-form">
          <label>账号 <input name="account" value="reviewer@example.test" /></label>
          <label>密码 <input name="password" type="password" value="not-a-secret" /></label>
          <button type="submit">登录</button>
        </form>
      </section>
    </main>
    <script src="../../scripts/inject-review-panel.js"></script>
    <script src="../review-panel-browser.assertions.js"></script>
    <script src="../module-review-browser.assertions.js"></script>
    <script src="../review-wake-browser.assertions.js"></script>
    <script>
      function startTrustedConfirmationCheck() {
        const api = globalThis.__PAGE_DELIVERY_REVIEW__;
        const shadow = document.querySelector("[data-page-delivery-review-host]").shadowRoot;
        const check = (condition, message) => { if (!condition) throw new Error(message); };
        shadow.querySelector('[data-action="submit"]').click();
        const submission = api.exportSubmission();
        const fingerprints = { planFingerprint: submission.planFingerprint, artifactRuleFingerprint: submission.artifactRuleFingerprint };
        api.applyResult({ ...submission, results: [{ id: "trusted-confirmation-result", cardIds: submission.cards.map(card => card.id),
          conclusion: "已确认", summary: "浏览器可信确认回归", planChangeSummary: "仅模拟保存回执，不写入实际 Plan 文件" }] });
        api.applyResult({ ...fingerprints, type: "CONFIRM_PLAN" });
        shadow.querySelector('[data-action="confirm-plan"]').click();
        check(api.getPlanConfirmationRequest() === null && api.getState().mode === "result", "Synthetic actions created confirmation permission");
        check(api.confirmPlan(fingerprints).lastError?.code === "confirmation-request-required", "Confirmation must require a trusted click");
        const output = document.createElement("pre");
        output.setAttribute("data-browser-assertions", "pending");
        output.textContent = "可信确认回归：请点击面板的“确认更新 Plan”。本测试不写文件。";
        document.body.append(output);
        let timer;
        const timeout = setTimeout(() => finish(new Error("Trusted confirmation timed out")), 300000);
        function finish(error) {
          clearInterval(timer);
          clearTimeout(timeout);
          output.setAttribute("data-browser-assertions", error ? "failed" : "passed");
          output.textContent = error ? error.message : "Trusted confirmation assertions passed; simulated receipt only";
        }
        timer = setInterval(() => {
          if (!api.getPlanConfirmationRequest()) return;
          try {
            const confirmed = api.confirmPlan({ ...fingerprints, type: "MARK_PLAN_SAVED" });
            check(confirmed.mode === "confirmed" && confirmed.saveState === "pending" && !confirmed.lastError, "Trusted confirmation did not produce pending save state");
            confirmed.saveState = "saved";
            check(api.getState().saveState === "pending", "Confirmation returned mutable internal state");
            const saved = api.markPlanSaved({ ...submission, savedPlanFingerprint: `sha256:${"b".repeat(64)}`, type: "CONFIRM_PLAN" });
            check(saved.saveState === "saved" && !saved.lastError && api.getPlanConfirmationRequest() === null, "Save receipt did not consume the trusted confirmation");
            finish();
          } catch (error) { finish(error); }
        }, 100);
      }

      async function mountPreview() {
        const query = new URLSearchParams(location.search);
        const fixture = "./module-review-session.json";
        const response = await fetch(fixture, { cache: "no-store" });
        if (!response.ok) throw new Error(`ReviewSession 加载失败：${response.status}`);
        globalThis.reviewSession = await response.json();
        if (query.has("confirm")) {
          const cards = globalThis.reviewSession.cards.slice(0, 1);
          globalThis.reviewSession = { ...globalThis.reviewSession, sessionId: "trusted-browser-confirmation", reviewRound: 1,
            viewScope: "all", cards,
            externalDependencies: [], mockModules: [],
            dependencyReview: { status: "reviewed", evidenceRefs: cards[0].sourceEvidence.map(item => item.id) },
            executionScope: { stage: "implementation", featureRefs: cards.map(card => card.id), taskRefs: [] } };
        }
        if (query.has("assert")) {
          localStorage.removeItem(`page-delivery-review:v1:${globalThis.reviewSession.deliveryUnitKey}`);
        }
        globalThis.PageDeliveryReviewPanel.mountReviewPanel(globalThis.reviewSession);
        if (query.has("confirm")) {
          startTrustedConfirmationCheck();
          return;
        }
        if (query.has("assert")) {
          let result;
          if (query.has("wake")) {
            result = await globalThis.runReviewWakeBrowserAssertions();
          } else if (query.has("module")) {
            result = await globalThis.runModuleReviewBrowserAssertions();
          } else {
            const moduleResult = await globalThis.runModuleReviewBrowserAssertions();
            const response = await fetch("./review-session.json", { cache: "no-store" });
            if (!response.ok) throw new Error(`通用状态回归会话加载失败：${response.status}`);
            globalThis.reviewSession = await response.json();
            localStorage.removeItem(`page-delivery-review:v1:${globalThis.reviewSession.deliveryUnitKey}`);
            globalThis.PageDeliveryReviewPanel.mountReviewPanel(globalThis.reviewSession);
            const stateResult = await globalThis.runPageDeliveryBrowserAssertions();
            result = { valid: moduleResult.valid && stateResult.valid, failures: [...moduleResult.failures, ...stateResult.failures] };
            globalThis.reviewSession = await (await fetch(fixture, { cache: "no-store" })).json();
            localStorage.removeItem(`page-delivery-review:v1:${globalThis.reviewSession.deliveryUnitKey}`);
            globalThis.PageDeliveryReviewPanel.mountReviewPanel(globalThis.reviewSession);
          }
          const output = document.createElement("pre");
          output.setAttribute("data-browser-assertions", result.valid ? "passed" : "failed");
          output.textContent = result.valid
            ? "Browser assertions passed"
            : result.failures.join("\n");
          document.body.append(output);
        }
      }

      mountPreview().catch((error) => {
        const message = document.createElement("pre");
        message.setAttribute("data-browser-assertions", "failed");
        message.textContent = error.stack || error.message;
        document.body.append(message);
      });

      const reloadEvents = new EventSource("/__reload");
      reloadEvents.addEventListener("message", () => location.reload());
    </script>
  </body>
</html>
